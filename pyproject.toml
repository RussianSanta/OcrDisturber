[project]
name = "ocr-disturber"
version = "0.1.0"
description = "Windows desktop application for preparing Word documents for OCR testing."
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[tool.pyside6.deploy]
title = "OcrDisturber"
input_file = "main.py"
exec_directory = "dist"
mode = "standalone"
